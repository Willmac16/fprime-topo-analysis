[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fprime-topology-analysis"
version = "0.1.0"
description = "Static concurrency analysis for F' topologies, joining the FPP model with the C++ implementation"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # The FPP model. fprime-python-model requires fprime-fpp>=3.3.0, and the
    # 3.3.0 AST carries the isDeployment flag the topology selection needs.
    # Older alphas (3.3.0a16) omit it and cannot be parsed by this model.
    "fprime-fpp>=3.3.0",
    "fprime-python-model>=3.3.1",
    # Intra-component call flow. Without it the analyses refuse to run, so
    # this is a hard dependency rather than an extra.
    "libclang>=16",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
fprime-component-call-graph = "fprime_topology_analysis.component_call_graph:main"
fprime-guarded-port-analyzer = "fprime_topology_analysis.guarded_port_analyzer:main"
fprime-async-queue-analyzer = "fprime_topology_analysis.async_queue_analyzer:main"
fprime-topology-checks = "fprime_topology_analysis.topology_checks:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# The rules this package is kept clean against. Run `ruff check .` before
# pushing; every finding here has been either fixed or deliberately silenced
# at its site with a reason.
select = [
    "F",     # pyflakes: undefined names, unused imports
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "B",     # bugbear: likely bugs, including loop-variable capture
    "SIM",   # simplifiable constructs
    "C4",    # comprehensions
    "RET",   # return statements
    "ARG",   # unused arguments
    "PIE",   # misc lints
    "PERF",  # avoidable per-iteration work
    "FURB",  # modernizable idioms
    "RUF005",  # iterable unpacking over concatenation
    "SLF001",  # private member access across objects
]
# E501 is left to the formatter; the analyses carry long explanatory strings
# that read worse when broken up.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests assert on internals deliberately, and fixtures import lazily so a
# missing tool chain skips rather than fails at collection time.
"tests/*" = ["ARG001", "SLF001"]
